[project]
name = "draftsx"
version = "0.1.0"
description = "CLI and local full-text index for Drafts.app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
draftsx = "draftsx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draftsx"]
