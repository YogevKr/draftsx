[project]
name = "draftsx"
version = "0.1.3"
description = "CLI and local full-text index for Drafts.app"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/YogevKr/draftsx"
Repository = "https://github.com/YogevKr/draftsx"

[project.scripts]
draftsx = "draftsx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draftsx"]
